name: Test and package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/demo.py
      - run: python scripts/autonomous_demo.py
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python scripts/check_wheel.py dist/*.whl
      - name: Exercise pinned development proxy
        if: matrix.python == '3.13'
        run: python scripts/check_proxy.py
      - name: Validate Compose without real credentials
        run: |
          PLOW_CREDENTIAL_FILE=/dev/null docker compose config --quiet
          PLOW_CREDENTIAL_FILE=/dev/null docker compose -f compose.yml -f compose.arm64.yml config --quiet
          PLOW_CREDENTIAL_FILE=/dev/null COMPOSE_PROJECT_NAME=good-company-install-acceptance GOOD_COMPANY_DASHBOARD_PORT=3017 docker compose -f compose.yml -f compose.arm64.yml config --format json | python -c 'import json,sys; c=json.load(sys.stdin); p=c["services"]["agent"]["ports"][0]; assert p["host_ip"]=="127.0.0.1" and p["published"]=="3017" and p["target"]==3001; assert c["services"]["dev-dashboard"]["environment"]["GOOD_COMPANY_DASHBOARD_PORT"]=="3017"; assert c["volumes"]["state"]["name"]=="good-company-install-acceptance_state"; assert c["volumes"]["coordination"]["name"]=="good-company-install-acceptance_coordination"'
          test ! -e plow-credentials
          if docker compose config --quiet 2>/dev/null; then
            echo "Normal startup must still require plow-credentials"
            exit 1
          fi
