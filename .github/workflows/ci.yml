name: Test and package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/demo.py
      - run: python scripts/autonomous_demo.py
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python scripts/check_wheel.py dist/*.whl
      - name: Exercise pinned development proxy
        if: matrix.python == '3.13'
        run: python scripts/check_proxy.py
      - name: Validate Compose without real credentials
        run: |
          touch plow-credentials
          docker compose config --quiet
          rm plow-credentials
