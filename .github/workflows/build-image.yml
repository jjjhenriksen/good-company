name: Build agent image
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Push this image to this repository's GHCR package
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test coordination behavior
        run: python3 -m unittest discover -s tests -v
      - name: Compute image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
      - name: Smoke-test packaged engine without starting services
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          docker run --rm --network none --entrypoint good-company "$IMAGE" --help
          python3 scripts/check_cycle_image.py "$IMAGE"
          docker run --rm --network none --entrypoint python3 "$IMAGE" -c 'import tempfile; from pathlib import Path; from good_company.tasks import WorkCoordinator; d=tempfile.TemporaryDirectory(); c=WorkCoordinator(Path(d.name)/"smoke.sqlite"); assert c.task_queue()==[]; c.db.close(); d.cleanup()'
          docker run --rm --network none --entrypoint python3 "$IMAGE" -c 'import json; from pathlib import Path; root=Path("/opt/plow/skills"); names=("community-operations", "event-coordination", "volunteer-coordination", "organization-knowledge"); assert all((root/n/"SKILL.md").is_file() for n in names); assert (root/"organization-knowledge/references/dress-rules.md").is_file(); examples=Path("/opt/good-company/examples"); assert (examples/"handbook.md").is_file(); [json.loads((examples/(n+".json")).read_text()) for n in ("profile", "autonomy", "team", "tasks", "dress-code")]; print("Packaged skills and examples verified")'
      - name: Publish the exact smoke-tested image
        if: inputs.publish
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
