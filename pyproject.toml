[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "good-company-agent"
version = "0.1.0"
description = "Calendar-led community coordination for small teams"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
good-company = "good_company.cli:main"
good-company-cycle = "good_company.cycle_cli:main"

[tool.setuptools.packages.find]
include = ["good_company*"]
